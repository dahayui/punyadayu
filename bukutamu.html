    <form action="forminputeks.html" method="get" enctype="multipart/form-data">
        <fieldset>
            <legend>Jejak Persinggahan</legend>

            <p>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" maxlength="100" required>

            </p>

                    Tuliskan kesan kamu terhadap laman ini di sini. 
                </textarea>
            </p>
           
            <p>
                <input type="kirim" name="btn" id="kirim" value="kirim">
